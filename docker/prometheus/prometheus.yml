global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # Blue-green deploy: one of these two containers is profile-gated off at any
  # given time (Phase 44). Prometheus scrapes both addresses; Docker DNS will
  # fail to resolve the inactive color, producing up=0 for that target — which
  # is exactly the signal we want. Query the active color with
  # `up{job="scrumquest"} == 1` or `max by (color) (up{job="scrumquest"})`.
  - job_name: 'scrumquest'
    metrics_path: '/metrics'
    scrape_timeout: 10s
    static_configs:
      - targets: ['app-blue:5000']
        labels:
          color: blue
      - targets: ['app-green:5000']
        labels:
          color: green

  - job_name: 'blackbox-tls'
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://scrummonsters.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# Ship metrics to Grafana Cloud. Replaces the previously-local Grafana
# container (removed 2026-05-12). Token lives at the password_file path,
# which the prometheus service mounts read-only from
# ./docker/prometheus/grafana_remote_write_token (gitignored, populated
# from .env on the VPS via deploy.sh / runbook).
remote_write:
  - url: https://prometheus-prod-67-prod-us-west-0.grafana.net/api/prom/push
    basic_auth:
      username: "3189754"
      password_file: /etc/prometheus/grafana_remote_write_token
