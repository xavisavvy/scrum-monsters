apiVersion: v1
kind: ConfigMap
metadata:
  name: scrummonsters-config
  namespace: scrummonsters
  labels:
    app.kubernetes.io/name: scrummonsters
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "5000"
  # CORS - adjust for your domain
  ALLOWED_ORIGINS: "https://scrummonsters.local,https://scrummonsters.com"
