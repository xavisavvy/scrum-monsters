# ScrumQuest Kubernetes Configuration
#
# This file is kept for backwards compatibility.
# For environment-specific deployments, use:
#   kubectl apply -k k8s/overlays/dev     # Development
#   kubectl apply -k k8s/overlays/staging # Staging
#   kubectl apply -k k8s/overlays/prod    # Production
#
# Structure:
#   k8s/base/           - Shared base manifests
#   k8s/overlays/dev/   - Development overrides
#   k8s/overlays/staging/ - Staging overrides
#   k8s/overlays/prod/  - Production overrides

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Default: use base configuration
resources:
  - base
