apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scrumquest

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "1.0.0"

# Image customization - override in overlays
images:
  - name: scrumquest
    newName: scrumquest
    newTag: latest
