apiVersion: v1
kind: ConfigMap
metadata:
  name: scrumquest-config
  labels:
    app.kubernetes.io/name: scrumquest
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
  # CORS - override in environment overlays
  ALLOWED_ORIGINS: "https://scrumquest.local"
