apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scrummonsters

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - deployment.yaml
  - migration-job.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: scrummonsters
  app.kubernetes.io/managed-by: kustomize

# Base image - overridden in overlays
images:
  - name: scrummonsters
    newName: scrummonsters
    newTag: latest
