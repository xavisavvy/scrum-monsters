apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scrumquest

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: scrumquest
  app.kubernetes.io/managed-by: kustomize

# Base image - overridden in overlays
images:
  - name: scrumquest
    newName: scrumquest
    newTag: latest
