apiVersion: v1
kind: Service
metadata:
  name: scrumquest-service
  labels:
    app.kubernetes.io/name: scrumquest
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: scrumquest
  # Enable sticky sessions for WebSocket support
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
