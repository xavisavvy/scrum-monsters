# SealedSecret Template
#
# This is a TEMPLATE file showing the structure of a SealedSecret.
# DO NOT commit actual sealed secrets here.
#
# To create a SealedSecret:
#
# 1. Install kubeseal CLI:
#    brew install kubeseal                    # macOS
#    scoop install kubeseal                   # Windows
#    curl -L ... | tar xz && mv kubeseal /usr/local/bin/  # Linux
#
# 2. Create a regular Kubernetes Secret YAML (do NOT commit this):
#    cat > /tmp/secret.yaml <<EOF
#    apiVersion: v1
#    kind: Secret
#    metadata:
#      name: scrumquest-secrets
#      namespace: scrumquest-prod
#    type: Opaque
#    stringData:
#      DATABASE_URL: "postgresql://user:password@host:5432/db"
#      SESSION_SECRET: "your-session-secret"
#    EOF
#
# 3. Seal it using kubeseal:
#    kubeseal --controller-name=sealed-secrets-controller \
#             --controller-namespace=kube-system \
#             --format yaml < /tmp/secret.yaml > k8s/overlays/prod/sealed-secrets.yaml
#
# 4. Delete the plain-text secret:
#    rm /tmp/secret.yaml
#
# 5. Commit the sealed secret (safe to commit!):
#    git add k8s/overlays/prod/sealed-secrets.yaml
#    git commit -m "feat: add production sealed secrets"

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: scrumquest-secrets
  namespace: scrumquest
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    # These values are encrypted and can only be decrypted by the
    # sealed-secrets controller in your specific cluster.
    # The encrypted values below are EXAMPLES and will not work.
    DATABASE_URL: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...
    SESSION_SECRET: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...
    REDIS_URL: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...
  template:
    metadata:
      name: scrumquest-secrets
      namespace: scrumquest
      labels:
        app.kubernetes.io/name: scrumquest
        app.kubernetes.io/component: secrets
    type: Opaque
