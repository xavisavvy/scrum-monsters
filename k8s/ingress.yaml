apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrumquest-ingress
  namespace: scrumquest
  labels:
    app.kubernetes.io/name: scrumquest
    app.kubernetes.io/component: ingress
  annotations:
    # For nginx-ingress controller
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "scrumquest-service"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    # Sticky sessions for WebSocket
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "scrumquest-affinity"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    # SSL redirect (uncomment for production with TLS)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # For cert-manager TLS (uncomment for production)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # TLS configuration (uncomment for production)
  # tls:
  #   - hosts:
  #       - scrumquest.local
  #     secretName: scrumquest-tls
  rules:
    - host: scrumquest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scrumquest-service
                port:
                  number: 80
          # Explicit WebSocket path
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: scrumquest-service
                port:
                  number: 80
