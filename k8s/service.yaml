apiVersion: v1
kind: Service
metadata:
  name: scrummonsters-service
  namespace: scrummonsters
  labels:
    app.kubernetes.io/name: scrummonsters
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: scrummonsters
  # Enable sticky sessions for WebSocket support
  # This ensures WebSocket connections stay on the same pod
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
