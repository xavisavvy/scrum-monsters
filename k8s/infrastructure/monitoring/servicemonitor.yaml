# ServiceMonitor for ScrumMonsters Application
# This tells Prometheus to scrape metrics from ScrumMonsters pods
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scrummonsters
  namespace: monitoring
  labels:
    app.kubernetes.io/name: scrummonsters
    app.kubernetes.io/component: monitoring
spec:
  # Match services in scrummonsters namespaces
  namespaceSelector:
    matchNames:
      - scrummonsters
      - scrummonsters-dev
      - scrummonsters-staging
      - scrummonsters-prod
  # Match scrummonsters services
  selector:
    matchLabels:
      app.kubernetes.io/name: scrummonsters
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
