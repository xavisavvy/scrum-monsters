apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Install cert-manager for automatic TLS certificate management
#
# Usage:
#   kubectl apply -k k8s/infrastructure/cert-manager
#
# This installs:
#   - cert-manager CRDs and controllers
#   - Let's Encrypt ClusterIssuers (staging and production)
#
# After installation, Ingresses can request certificates using:
#   annotations:
#     cert-manager.io/cluster-issuer: "letsencrypt-prod"  # or letsencrypt-staging

namespace: cert-manager

resources:
  # cert-manager v1.14.x
  - https://github.com/cert-manager/cert-manager/releases/download/v1.14.7/cert-manager.yaml
  # ClusterIssuers for Let's Encrypt
  - cluster-issuer.yaml

# Add labels
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: scrumquest
