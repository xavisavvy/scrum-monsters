apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scrumquest-dev

namePrefix: dev-

resources:
  - ../../base

# Development-specific labels
commonLabels:
  app.kubernetes.io/environment: dev

# Override image for dev
images:
  - name: scrumquest
    newName: scrumquest
    newTag: dev

# Dev-specific patches
patches:
  - path: patches/deployment-patch.yaml
  - path: patches/configmap-patch.yaml
  - path: patches/hpa-patch.yaml

# Generate dev secrets (for local development only)
secretGenerator:
  - name: scrumquest-secrets
    literals:
      - DATABASE_URL=postgresql://scrumquest:dev-password@dev-postgres-service:5432/scrumquest
      - SESSION_SECRET=dev-session-secret-change-in-production
      - REDIS_URL=redis://dev-redis-service:6379
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - GITHUB_CLIENT_ID=
      - GITHUB_CLIENT_SECRET=
  - name: postgres-secrets
    literals:
      - POSTGRES_USER=scrumquest
      - POSTGRES_PASSWORD=dev-password
      - POSTGRES_DB=scrumquest

generatorOptions:
  disableNameSuffixHash: true
