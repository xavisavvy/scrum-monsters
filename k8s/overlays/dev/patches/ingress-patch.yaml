apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrummonsters-ingress
  annotations:
    # Self-signed certificate for local development
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    # Don't force SSL redirect in dev
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
    - hosts:
        - scrummonsters-dev.local
      secretName: scrummonsters-dev-tls
  rules:
    - host: scrummonsters-dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dev-scrummonsters-service
                port:
                  number: 80
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: dev-scrummonsters-service
                port:
                  number: 80
