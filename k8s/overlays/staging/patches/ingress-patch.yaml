apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrummonsters-ingress
  annotations:
    # Enable SSL redirect for staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager for TLS (staging Let's Encrypt)
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  tls:
    - hosts:
        - staging.scrummonsters.local
      secretName: scrummonsters-staging-tls
  rules:
    - host: staging.scrummonsters.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: staging-scrummonsters-service
                port:
                  number: 80
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: staging-scrummonsters-service
                port:
                  number: 80
