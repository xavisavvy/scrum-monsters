apiVersion: v1
kind: Secret
metadata:
  name: scrumquest-secrets
  namespace: scrumquest
  labels:
    app.kubernetes.io/name: scrumquest
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database connection (points to in-cluster PostgreSQL)
  DATABASE_URL: "postgresql://scrumquest:CHANGE_ME@postgres-service:5432/scrumquest"

  # Session secret - MUST change in production (use: openssl rand -base64 32)
  SESSION_SECRET: "CHANGE_ME_TO_A_SECURE_RANDOM_STRING"

  # Redis connection (optional - for caching)
  REDIS_URL: "redis://redis-service:6379"

  # OAuth credentials (optional - leave empty to disable)
  # Get from: https://console.cloud.google.com/apis/credentials
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Get from: https://github.com/settings/developers
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
---
# PostgreSQL credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: scrumquest
  labels:
    app.kubernetes.io/name: scrumquest
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: "scrumquest"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "scrumquest"
