apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrummonsters
  namespace: scrummonsters
  labels:
    app.kubernetes.io/name: scrummonsters
    app.kubernetes.io/component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scrummonsters
  template:
    metadata:
      labels:
        app: scrummonsters
        app.kubernetes.io/name: scrummonsters
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: scrummonsters
          image: scrummonsters:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: scrummonsters-config
            - secretRef:
                name: scrummonsters-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health/livez
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/readyz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      # Pod-level security
      securityContext:
        fsGroup: 1001
      # Spread across nodes for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: scrummonsters
