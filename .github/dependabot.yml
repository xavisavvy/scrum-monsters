version: 2

updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    # Group minor and patch updates together
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Keep major updates separate for review
      # Security updates (advisory-driven, opened as soon as an alert fires,
      # usually for transitive deps) are NOT covered by the group above --
      # groups apply to scheduled version updates unless they say otherwise.
      # Without this they arrive as one PR per package, and under the "branch
      # must be up to date" rule each one needs its own rebase + full CI run
      # after every merge. Batch them into a single PR instead.
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # Limit to reduce noise
    open-pull-requests-limit: 10
    # Add labels for easier filtering
    labels:
      - "dependencies"
      - "npm"
    # Auto-merge settings handled by separate workflow
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "xavisavvy"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Actions are third-party-published but version-pinned and low-risk to
    # bump as a batch (mostly Node-runtime-EOL major bumps with no input
    # changes) — group them all into one PR instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    open-pull-requests-limit: 3
