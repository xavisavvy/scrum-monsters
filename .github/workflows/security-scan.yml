name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gitleaks:
    name: Secret Detection
    runs-on: '${{ fromJSON(github.event.pull_request.head.repo.fork && ''["ubuntu-latest"]'' || ''["self-hosted", "Linux", "X64"]'') }}'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for complete scanning

      # Bypassing gitleaks/gitleaks-action@v2 — its cache layer on the
      # Synology runner restores the binary without the +x bit, producing
      # `spawn /tmp/gitleaks-*/gitleaks EACCES`. We install and invoke the
      # CLI directly instead. Trade-off: no auto-PR-comments from the
      # action; the SARIF report still uploads to the Security tab below.
      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.3"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Run gitleaks
        run: |
          /tmp/gitleaks detect \
            --redact \
            -v \
            --config=.gitleaks.toml \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-opts=-1
