name: Provision VPS Secrets

# Re-runnable workflow: copies selected repository secrets into
# /opt/scrummonsters/.env on the VPS so the deploy script and on-VPS
# automation can read them. Use after rotating any of the listed secrets.
#
# Currently provisions: NPM_ADMIN_EMAIL, NPM_ADMIN_PASSWORD (Phase 44 deploy bot).
# Extend the secrets list, env block, and script body below when adding new keys.
#
# Idempotent: if a key already exists in .env it is replaced, not duplicated.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    name: Append NPM admin creds to VPS .env
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: SSH and append (idempotent)
        uses: appleboy/ssh-action@v1
        env:
          NPM_ADMIN_EMAIL: ${{ secrets.NPM_ADMIN_EMAIL }}
          NPM_ADMIN_PASSWORD: ${{ secrets.NPM_ADMIN_PASSWORD }}
        with:
          host: 34.199.135.244
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NPM_ADMIN_EMAIL,NPM_ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/scrummonsters

            if [ -z "${NPM_ADMIN_EMAIL:-}" ] || [ -z "${NPM_ADMIN_PASSWORD:-}" ]; then
              echo "ERROR: NPM_ADMIN_EMAIL or NPM_ADMIN_PASSWORD secret is not set in repository secrets."
              exit 1
            fi

            touch .env
            chmod 600 .env

            # Idempotent upsert: remove any existing line, then append fresh.
            tmp=$(mktemp)
            chmod 600 "$tmp"
            grep -vE '^NPM_ADMIN_(EMAIL|PASSWORD)=' .env > "$tmp" || true
            mv "$tmp" .env
            chmod 600 .env

            printf 'NPM_ADMIN_EMAIL=%s\n' "$NPM_ADMIN_EMAIL" >> .env
            printf 'NPM_ADMIN_PASSWORD=%s\n' "$NPM_ADMIN_PASSWORD" >> .env

            # Verify presence (counts only, never values).
            count=$(grep -cE '^NPM_ADMIN_(EMAIL|PASSWORD)=' .env || true)
            echo "NPM_ADMIN_* keys present in .env: $count (expected 2)"
            test "$count" = "2"

            echo "Provisioning complete. .env perms:"
            ls -l .env
