# One-shot diagnostic workflow for the GIST_SECRET repo secret.
# Delete this file once the Coverage Badge job is green again.
# Runs only on manual workflow_dispatch — never on push or schedule.
name: _debug-gist-secret

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GIST_SECRET against the coverage gist
        env:
          GIST_SECRET: ${{ secrets.GIST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${GIST_SECRET:-}" ]; then
            echo "::error::GIST_SECRET is empty or not set at the repo level"
            exit 1
          fi

          echo "== Token shape =="
          # Print the prefix only (4 chars). Actions auto-redacts the full
          # value if it ever appeared in output, so this is belt-and-suspenders.
          echo "length: ${#GIST_SECRET} chars"
          echo "prefix: ${GIST_SECRET:0:4}***  (classic PATs start with ghp_, fine-grained with github_pat_)"

          echo
          echo "== GET gist (read) =="
          status_get=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GIST_SECRET}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/gists/2dc22fe821097a745ca169e89e8159f1)
          echo "HTTP ${status_get}"

          echo
          echo "== Token scopes (classic PATs only) =="
          curl -sS -I \
            -H "Authorization: token ${GIST_SECRET}" \
            https://api.github.com/ \
            | grep -iE "^x-(oauth-scopes|accepted-oauth-scopes|github-)" \
            || echo "(no x-oauth-scopes header — fine-grained PAT or invalid token)"

          echo
          echo "== Authenticated user =="
          curl -sS \
            -H "Authorization: token ${GIST_SECRET}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user \
            | jq -r '"login: \(.login // "<unauthenticated>")\ntype: \(.type // "?")"' || true

          echo
          echo "== Interpretation =="
          case "${status_get}" in
            200) echo "OK — token can read the gist. If CI still 401s, the failure is elsewhere." ;;
            401) echo "FAIL — 401 means the token in GIST_SECRET is invalid for this gist. Check token scope (gist) and that you regenerated for the xavisavvy account." ;;
            404) echo "FAIL — 404 means the gist isn't visible to this token (private gist owned by another account, or wrong gist ID)." ;;
            *)   echo "Unexpected status ${status_get}" ;;
          esac
