name: Security Audit (nightly)

# Full dependency audit of the whole tree (audit-ci, levels from .audit-ci.json).
# PRs only block on advisories they introduce (ci.yml -> Security Audit); this is
# where advisories already in the tree surface. A red run here means: upgrade,
# or allowlist the GHSA id in .audit-ci.json with a reason.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"

jobs:
  audit:
    name: Full Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm run audit
