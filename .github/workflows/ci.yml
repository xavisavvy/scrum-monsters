name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"

jobs:
  # Quick checks that fail fast
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: '${{ fromJSON((github.event.pull_request.head.repo.fork || github.actor == ''dependabot[bot]'') && ''["ubuntu-latest"]'' || ''["self-hosted", "Linux", "X64"]'') }}'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: '${{ fromJSON((github.event.pull_request.head.repo.fork || github.actor == ''dependabot[bot]'') && ''["ubuntu-latest"]'' || ''["self-hosted", "Linux", "X64"]'') }}'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage.enabled true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Report Coverage
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          file-coverage-mode: changes

  build:
    name: Build
    runs-on: '${{ fromJSON((github.event.pull_request.head.repo.fork || github.actor == ''dependabot[bot]'') && ''["ubuntu-latest"]'' || ''["self-hosted", "Linux", "X64"]'') }}'
    timeout-minutes: 15
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # Blocks a PR only on high/critical advisories that the PR itself introduces
  # (levels + allowlist from .audit-ci.json). PRs that don't touch the lockfile
  # pass immediately. The full audit of the existing tree runs nightly in
  # security-audit-nightly.yml -- running it here failed every PR on advisories
  # the PR had nothing to do with.
  security-audit:
    name: Security Audit
    # GitHub-hosted: lockfile-only audit, no install, and free on a public repo.
    # Keeps it from queueing behind the self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Did this PR change dependencies?
        id: deps
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Not a PR - the full audit runs nightly (security-audit-nightly.yml)."
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename' \
               | grep -qxE 'package(-lock)?\.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "package.json / package-lock.json unchanged - nothing new to audit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.deps.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit base and head lockfiles
        if: steps.deps.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/base"
          git show "$BASE_SHA:package.json" > "$RUNNER_TEMP/base/package.json"
          git show "$BASE_SHA:package-lock.json" > "$RUNNER_TEMP/base/package-lock.json"
          # npm audit exits non-zero whenever it finds anything; the comparison decides.
          (cd "$RUNNER_TEMP/base" && npm audit --json --package-lock-only > "$RUNNER_TEMP/base-audit.json") || true
          npm audit --json --package-lock-only > "$RUNNER_TEMP/head-audit.json" || true
          node scripts/ci/audit-new-vulns.mjs "$RUNNER_TEMP/base-audit.json" "$RUNNER_TEMP/head-audit.json"

  license-check:
    name: License Check
    # GitHub-hosted: seconds of work that used to queue 15-30 min for a self-hosted runner. Free on a public repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check license compliance
        run: npm run license-check

  validate-migrations:
    name: Validate Migrations
    runs-on: '${{ fromJSON((github.event.pull_request.head.repo.fork || github.actor == ''dependabot[bot]'') && ''["ubuntu-latest"]'' || ''["self-hosted", "Linux", "X64"]'') }}'
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          # Host port 15432 (not 5432) to avoid collision with DSM's native
          # Postgres on the self-hosted Synology runner. Inside the service
          # container Postgres still listens on 5432; the mapping rewrites
          # only the host-side port that the job's `localhost:NNNNN` URL hits.
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/test
        run: npm run db:migrate

      - name: Check for schema drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:15432/test
        run: |
          # Generate would create files if schema changed without migration
          npx drizzle-kit generate

          # Check if any new files were generated
          if [ -n "$(git status --porcelain migrations/)" ]; then
            echo "::error::Schema changes detected without corresponding migration"
            echo "Run: npm run db:migrate:generate"
            echo ""
            echo "Uncommitted changes in migrations/:"
            git status migrations/
            echo ""
            echo "Diff:"
            git diff migrations/
            exit 1
          fi

          echo "Schema and migrations are in sync"

  # Lint deploy bash modules (Plan 44-02) — shellcheck + bats. Keeps the
  # blue-green deploy helpers from rotting between deploys.
  # Pinned to ubuntu-latest unconditionally because the install step uses
  # apt-get, which doesn't exist on the Synology self-hosted runner.
  # shellcheck and bats are sub-30s installs; no value in routing to
  # self-hosted for this job.
  deploy-scripts:
    name: Deploy script lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats jq

      - name: Shellcheck deploy library
        run: shellcheck -x scripts/deploy/lib/*.sh scripts/deploy/wave0-npm-discovery.sh scripts/deploy/deploy-bluegreen.sh scripts/deploy/rollback-bluegreen.sh

      - name: Bats deploy library
        run: bats scripts/deploy/test/

  # Summary job for branch protection rules
  ci-success:
    name: CI Success
    # GitHub-hosted: seconds of work that used to queue 15-30 min for a self-hosted runner. Free on a public repo.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-and-typecheck, test, build, security-audit, license-check, validate-migrations, deploy-scripts]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.security-audit.result }}" != "success" ]] || \
             [[ "${{ needs.license-check.result }}" != "success" ]] || \
             [[ "${{ needs.validate-migrations.result }}" != "success" ]] || \
             [[ "${{ needs.deploy-scripts.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

  update-coverage-badge:
    name: Update Coverage Badge
    runs-on: '${{ fromJSON((github.event.pull_request.head.repo.fork || github.actor == ''dependabot[bot]'') && ''["ubuntu-latest"]'' || ''["self-hosted", "Linux", "X64"]'') }}'
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 2dc22fe821097a745ca169e89e8159f1
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          maxColorRange: 90
          minColorRange: 50
