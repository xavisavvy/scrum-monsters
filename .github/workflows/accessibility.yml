name: Accessibility Testing

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"

jobs:
  # Cheap typecheck gate (~30-60s) so we don't spin up the Playwright
  # container (~3-5 min) when a TypeScript error would have failed the
  # PR anyway. The Playwright job below `needs: pre-check`.
  pre-check:
    name: Pre-check (typecheck)
    runs-on: '${{ fromJSON(github.event.pull_request.head.repo.fork && ''["ubuntu-latest"]'' || ''["self-hosted", "Linux", "X64"]'') }}'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check

  accessibility:
    name: Accessibility Tests (axe-core)
    needs: pre-check
    runs-on: '${{ fromJSON(github.event.pull_request.head.repo.fork && ''["ubuntu-latest"]'' || ''["self-hosted", "Linux", "X64"]'') }}'
    env:
      # Firefox refuses to launch as root when $HOME isn't owned by root —
      # the container's default $HOME (/github/home) is owned by the host
      # runner's user, not root. Official Playwright-in-container workaround.
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # No --user pin: container runs as root. We chown the workspace +
      # cache dirs back to RUNNER_UID:RUNNER_GID in a final 'always()'
      # step. Makes this workflow agnostic to which self-hosted runner
      # picks up the job (heimdall uid=1030, shadowsong-wsl uid=1000).
      options: --init --ipc=host

    steps:
      # Belt-and-suspenders: previous container runs that were cancelled
      # mid-job leave root-owned files in the workspace (/__w/_temp,
      # /__w/<repo>, /github/home) that the runner can't clean on the
      # next job. We run as root inside the container, so chmod those
      # paths to make them world-writable. Wrapped in `|| true` so it
      # never fails the job. Pairs with the end-of-job chown step which
      # restores ownership on the happy path.
      - name: Pre-clean - make any leftover files cleanable
        run: chmod -R o+rwX /__w /github/home 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests
        id: a11y-tests
        run: npm run test:a11y
        continue-on-error: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: steps.a11y-tests.outcome == 'failure'
        with:
          name: a11y-test-results
          path: test-results/
          retention-days: 7

      - name: Comment PR on failure
        if: steps.a11y-tests.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Accessibility Tests Failed

            Critical or serious accessibility violations were found that block this PR.

            **What this means:**
            - WCAG 2.1 Level A violations or high-impact (critical/serious) issues were detected
            - These issues significantly impact users with disabilities

            **Next steps:**
            1. [Download the accessibility report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) (Artifacts section)
            2. Review violation details in the test output
            3. Fix the identified accessibility issues
            4. Each violation includes:
               - Element selector
               - WCAG rule violated
               - Impact level
               - Suggested fix
               - Help URL with detailed guidance

            **Resources:**
            - [axe-core rule descriptions](https://dequeuniversity.com/rules/axe/4.6)
            - [WCAG 2.1 Quick Reference](https://www.w3.org/WAI/WCAG21/quickref/)

            _Note: Moderate and minor violations are logged as warnings but do not block merge._`
            })

      # Chown root-owned files back to the runner host's user before the
      # container exits, so the NEXT actions/checkout on this host can
      # clean the workspace without EACCES. Runner-agnostic: each runner
      # is configured with its own RUNNER_UID/RUNNER_GID in its .env file
      # (heimdall: 1030:100, shadowsong-wsl-local: 1000:1000). Falls back
      # to root (a no-op) when the env vars aren't set.
      - name: Chown workspace back to runner user
        if: always()
        run: |
          uid="${RUNNER_UID:-0}"
          gid="${RUNNER_GID:-0}"
          chown -R "$uid:$gid" "$GITHUB_WORKSPACE" /github/home /__w/_temp 2>/dev/null || true

      - name: Fail if tests failed
        if: steps.a11y-tests.outcome == 'failure'
        run: exit 1
