name: Deploy to Lightsail

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  REMOTE_HOST: "34.199.135.244"
  REMOTE_USER: "ubuntu"
  REMOTE_DIR: "/opt/scrummonsters"

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    environment:
      name: staging
      url: https://scrummonsters.com

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Staging-Deploy

      - name: Deploy via SSH (blue-green)
        uses: appleboy/ssh-action@v1
        env:
          NPM_ADMIN_EMAIL: ${{ secrets.NPM_ADMIN_EMAIL }}
          NPM_ADMIN_PASSWORD: ${{ secrets.NPM_ADMIN_PASSWORD }}
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NPM_ADMIN_EMAIL,NPM_ADMIN_PASSWORD
          # set -e (NOT -ex) — never trace the password.
          # The orchestrator (scripts/deploy/deploy-bluegreen.sh) handles:
          #   pull -> start inactive color -> healthcheck -> drizzle migrate ->
          #   NPM swap -> external smoke -> persist .active-color -> stop old color.
          # Auto-rollback (pre-swap) if healthcheck fails.
          script: |
            set -e
            cd /opt/scrummonsters
            echo "[setup] Pulling latest deploy scripts from main..."
            git fetch origin main
            git reset --hard origin/main
            echo "[setup] Disk usage before:"
            df -h / | tail -1
            echo "[setup] Invoking blue-green deploy orchestrator..."
            bash scripts/deploy/deploy-bluegreen.sh
            echo "[setup] Disk usage after:"
            df -h / | tail -1
            echo "Staging deploy complete."

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://scrummonsters.com

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Prod-Deploy

      - name: Deploy via SSH (blue-green)
        uses: appleboy/ssh-action@v1
        env:
          NPM_ADMIN_EMAIL: ${{ secrets.NPM_ADMIN_EMAIL }}
          NPM_ADMIN_PASSWORD: ${{ secrets.NPM_ADMIN_PASSWORD }}
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NPM_ADMIN_EMAIL,NPM_ADMIN_PASSWORD
          script: |
            set -e
            cd /opt/scrummonsters
            echo "[setup] Pulling latest deploy scripts from main..."
            git fetch origin main
            git reset --hard origin/main
            echo "[setup] Disk usage before:"
            df -h / | tail -1
            echo "[setup] Invoking blue-green deploy orchestrator..."
            bash scripts/deploy/deploy-bluegreen.sh
            echo "[setup] Disk usage after:"
            df -h / | tail -1
            echo "Production deploy complete."

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy-staging, deploy-prod]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-prod.result == 'success')

    steps:
      - name: Smoke test via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # External URLs (https://scrummonsters.com/...) hit NPM, which proves
          # the post-deploy upstream re-route. The host port 5000 is NOT
          # published in the blue-green topology (Plan 44-01) so localhost:5000
          # would 404 even on a healthy deploy.
          script: |
            set -e
            echo "[1/3] External health endpoint via NPM..."
            curl --fail --silent --show-error https://scrummonsters.com/api/health
            echo ""
            echo "[2/3] External WebSocket health via NPM..."
            curl --fail --silent --show-error https://scrummonsters.com/api/ws-health
            echo ""
            echo "[3/3] Active color check..."
            cat /opt/scrummonsters/.active-color
            echo ""
            echo "All smoke tests passed."
