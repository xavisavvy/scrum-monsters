          echo "Waiting for application to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:5000/api/health; then
              echo "Application is ready"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 2
          done
          echo "Application failed to start"
          exit 1

      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/${{ env.K6_VERSION }}/k6-${{ env.K6_VERSION }}-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/
          k6 version

      - name: Run idle connection test
        continue-on-error: true
        run: k6 run tests/load/websocket/idle-connection.test.js --out json=results-idle.json
        env:
          K6_ENV: ci

      - name: Upload idle connection test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: idle-connection-test-results
          path: results-idle.json
          retention-days: 30

      - name: Generate idle connection summary
        if: always()
        run: |
          echo "## Idle Connection Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Idle Connection Test (50 VUs, 5 minutes)" >> $GITHUB_STEP_SUMMARY
          if [ -f results-idle.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            tail -1 results-idle.json | jq -r '.metrics | to_entries | map("\(.key): \(.value.values | to_entries | map("\(.key)=\(.value|tostring)") | join(", "))") | .[]' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Parse error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file found" >> $GITHUB_STEP_SUMMARY
          fi
