      - name: Run WebSocket game flow test
        continue-on-error: true
        run: k6 run tests/load/websocket/game-flow.test.js --out json=results-ws-game.json
        env:
          K6_ENV: ci

      - name: Upload WebSocket test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: websocket-load-test-results
          path: results-ws-*.json
          retention-days: 30

      - name: Generate WebSocket summary
        if: always()
        run: |
          echo "## WebSocket Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Game Flow Test (100 VUs, 30s)" >> $GITHUB_STEP_SUMMARY
          if [ -f results-ws-game.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            tail -1 results-ws-game.json | jq -r '.metrics | to_entries | map("\(.key): \(.value.values | to_entries | map("\(.key)=\(.value|tostring)") | join(", "))") | .[]' >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Parse error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file found" >> $GITHUB_STEP_SUMMARY
          fi

  idle-connection-test:
    name: Idle Connection Test
    runs-on: '${{ fromJSON(github.event.pull_request.head.repo.fork && ''["ubuntu-latest"]'' || ''["self-hosted", "Linux", "X64"]'') }}'
    timeout-minutes: 10
    if: github.event.inputs.run_idle_test == 'true' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
