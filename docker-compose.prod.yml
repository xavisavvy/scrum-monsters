# Production Docker Compose stack for ScrumMonsters
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d
# Requires: .env file at /opt/scrummonsters/.env (see runbook.md for format)
# Note: Port 81 (NPM admin) should be removed from Lightsail firewall after TLS setup

services:
  # Blue-green deploy topology (Phase 44).
  # Both colors share the same image, env, healthcheck, and Postgres dependency.
  # Neither publishes a host port — NPM reaches them on the Docker network via
  # `container_name:` DNS (Pitfall 6 — RESEARCH.md). Each color is gated by a
  # Compose profile so a plain `docker compose up -d` never starts both at once;
  # the deploy script (Plan 44-03) selects the inactive color and starts it
  # explicitly with `docker compose --profile <color> up -d app-<color>`.
  app-blue:
    image: ghcr.io/xavisavvy/scrum-monsters:${APP_IMAGE_TAG:-latest}
    container_name: app-blue
    profiles: ["blue"]
    stop_grace_period: 45s
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: "5000"
      ALLOWED_ORIGINS: https://scrummonsters.com
      BASE_URL: https://scrummonsters.com
      # Optional OAuth providers — uncomment and set values in .env to enable
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      # GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # Optional Upstash Redis — uncomment if using
      # UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      # UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app-green:
    image: ghcr.io/xavisavvy/scrum-monsters:${APP_IMAGE_TAG:-latest}
    container_name: app-green
    profiles: ["green"]
    stop_grace_period: 45s
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: "5000"
      ALLOWED_ORIGINS: https://scrummonsters.com
      BASE_URL: https://scrummonsters.com
      # Optional OAuth providers — uncomment and set values in .env to enable
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      # GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # Optional Upstash Redis — uncomment if using
      # UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      # UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    build: ./docker/postgres-backup
    environment:
      SCHEDULE: "0 2 * * *"
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${BACKUP_S3_BUCKET}
      S3_PREFIX: scrummonsters
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx-proxy-manager:
    # Pinned (Phase 44, Pitfall 8 — RESEARCH.md): once the deploy script depends
    # on the NPM REST API contract, an upstream NPM update could silently break
    # deploys. Captured 2026-05-08 via Wave 0 operator discovery against the live
    # VPS (image digest sha256:2aa69b38..., NPM API version v2.14.0). Update this
    # tag only after re-running scripts/deploy/wave0-npm-discovery.sh against an
    # NPM upgrade to confirm the API contract still matches.
    image: jc21/nginx-proxy-manager:2.14.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"   # NPM admin UI — remove this port from Lightsail firewall after TLS setup
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    environment:
      TZ: America/New_York

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker/prometheus/grafana_remote_write_token:/etc/prometheus/grafana_remote_write_token:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
      - '--storage.tsdb.path=/prometheus'
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    # NOTE (Phase 44): the previous `depends_on: - app` was advisory only.
    # With profile-gated app-blue / app-green, Compose v2 treats `depends_on`
    # against a profile-disabled service as an invalid project, so we drop the
    # dep entirely. Prometheus scrapes the active color via service-discovery
    # config, not start ordering.

  # grafana + dozzle removed 2026-05-12 — Grafana Cloud is now the dashboard
  # surface (Prometheus remote_write below). Local containers consumed ~150 MB
  # resident on a 914 MB box which drove swap thrashing and intermittent
  # outages. Restore from git history if you ever want them back.

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./docker/blackbox/blackbox.yml:/config/blackbox.yml:ro
    command:
      - '--config.file=/config/blackbox.yml'
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

  # Host-level metrics for the Lightsail VM (CPU, memory, disk, network, load).
  # Mounts the host root read-only so collectors can read /proc and /sys from
  # the host namespace rather than the container's.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($$|/)'
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

  # Postgres metrics (connections, query rates, cache hit ratio, replication
  # lag, etc.) for the scrum-monsters Postgres instance. Reuses the existing
  # app DB user — Phase 44+ could provision a dedicated `pg_monitor` role if
  # finer-grained metrics (pg_stat_statements, pg_locks across all DBs) are
  # ever needed.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

volumes:
  postgres_data:    # Named volume — Docker manages location; use docker volume commands for backup
  npm_data:
  npm_letsencrypt:
  prometheus_data:
