asyncapi: 3.0.0
info:
  title: ScrumQuest WebSocket API
  version: 1.0.0
  description: |
    Real-time multiplayer scrum poker estimation game WebSocket API.

    ScrumQuest uses Socket.IO for real-time communication between clients and the server.
    This specification documents all WebSocket events for lobby management, avatar selection,
    battle mechanics, estimation/scoring, and combat systems.

    Events are organized into categories:
    - **Lobby Events**: Creating, joining, and managing game lobbies
    - **Avatar Events**: Character selection and positioning
    - **Battle Events**: Boss combat and player interactions
    - **Estimation Events**: Score submission and voting
    - **Session Events**: Fine-grained player session management
    - **Combat Events**: Detailed combat mechanics
    - **System Events**: State synchronization and recovery

servers:
  development:
    host: localhost:5000
    protocol: wss
    description: Development server with Socket.IO
  production:
    host: scrumquest.app
    protocol: wss
    description: Production server

defaultContentType: application/json

channels:
  # Client-to-Server Channel
  clientToServer:
    address: /
    description: Events sent from client to server via Socket.IO
    messages:
      # Lobby Management
      createLobby:
        $ref: '#/components/messages/createLobby'
      joinLobby:
        $ref: '#/components/messages/joinLobby'
      # Avatar and Team
      selectAvatar:
        $ref: '#/components/messages/selectAvatar'
      assignTeam:
        $ref: '#/components/messages/assignTeam'
      changeOwnTeam:
        $ref: '#/components/messages/changeOwnTeam'
      # Ticket Management
      addTickets:
        $ref: '#/components/messages/addTickets'
      removeTicket:
        $ref: '#/components/messages/removeTicket'
      updateJiraSettings:
        $ref: '#/components/messages/updateJiraSettings'
      # Lobby Movement
      lobbyPlayerPos:
        $ref: '#/components/messages/lobbyPlayerPos'
      lobbyPlayerJump:
        $ref: '#/components/messages/lobbyPlayerJump'
      lobbyEmote:
        $ref: '#/components/messages/lobbyEmote'
      # Battle Control
      startBattle:
        $ref: '#/components/messages/startBattle'
      submitScore:
        $ref: '#/components/messages/submitScore'
      updateDiscussionVote:
        $ref: '#/components/messages/updateDiscussionVote'
      attackBoss:
        $ref: '#/components/messages/attackBoss'
      proceedNextLevel:
        $ref: '#/components/messages/proceedNextLevel'
      restartGame:
        $ref: '#/components/messages/restartGame'
      # Performance and Control
      playerPerformance:
        $ref: '#/components/messages/playerPerformance'
      abandonQuest:
        $ref: '#/components/messages/abandonQuest'
      forceReveal:
        $ref: '#/components/messages/forceReveal'
      updateTimerSettings:
        $ref: '#/components/messages/updateTimerSettings'
      # Media
      youtubePlay:
        $ref: '#/components/messages/youtubePlay'
      youtubeStop:
        $ref: '#/components/messages/youtubeStop'
      # Admin Control
      advancePhaseNow:
        $ref: '#/components/messages/advancePhaseNow'
      forceVotingProgression:
        $ref: '#/components/messages/forceVotingProgression'
      # Combat Movement
      playerPos:
        $ref: '#/components/messages/playerPos'
      attackPlayer:
        $ref: '#/components/messages/attackPlayer'
      reviveStart:
        $ref: '#/components/messages/reviveStart'
      reviveCancel:
        $ref: '#/components/messages/reviveCancel'
      reviveTick:
        $ref: '#/components/messages/reviveTick'
      healParty:
        $ref: '#/components/messages/healParty'
      playerJump:
        $ref: '#/components/messages/playerJump'
      bossDamagePlayer:
        $ref: '#/components/messages/bossDamagePlayer'
      playerProjectile:
        $ref: '#/components/messages/playerProjectile'
      # Reconnection
      reconnectWithToken:
        $ref: '#/components/messages/reconnectWithToken'
      requestMissedEvents:
        $ref: '#/components/messages/requestMissedEvents'
      # Minion and Discussion
      attackMinion:
        $ref: '#/components/messages/attackMinion'
      finalizeEstimate:
        $ref: '#/components/messages/finalizeEstimate'

  # Server-to-Client Channel
  serverToClient:
    address: /
    description: Events sent from server to client via Socket.IO
    messages:
      # Lobby Events
      lobbyCreated:
        $ref: '#/components/messages/lobbyCreated'
      lobbyJoined:
        $ref: '#/components/messages/lobbyJoined'
      lobbyUpdated:
        $ref: '#/components/messages/lobbyUpdated'
      avatarSelected:
        $ref: '#/components/messages/avatarSelected'
      lobbyPlayerPosServer:
        $ref: '#/components/messages/lobbyPlayerPosServer'
      lobbyPlayerJumpServer:
        $ref: '#/components/messages/lobbyPlayerJumpServer'
      lobbyEmoteServer:
        $ref: '#/components/messages/lobbyEmoteServer'
      playerJoined:
        $ref: '#/components/messages/playerJoined'
      # Battle Events
      battleStarted:
        $ref: '#/components/messages/battleStarted'
      scoreSubmitted:
        $ref: '#/components/messages/scoreSubmitted'
      scoresRevealed:
        $ref: '#/components/messages/scoresRevealed'
      bossAttacked:
        $ref: '#/components/messages/bossAttacked'
      bossDefeated:
        $ref: '#/components/messages/bossDefeated'
      questAbandoned:
        $ref: '#/components/messages/questAbandoned'
      gameOver:
        $ref: '#/components/messages/gameOver'
      bossHealed:
        $ref: '#/components/messages/bossHealed'
      modifierUpdated:
        $ref: '#/components/messages/modifierUpdated'
      # Error and State Events
      gameError:
        $ref: '#/components/messages/gameError'
      votingTimeout:
        $ref: '#/components/messages/votingTimeout'
      playerDisconnected:
        $ref: '#/components/messages/playerDisconnected'
      hostTransferred:
        $ref: '#/components/messages/hostTransferred'
      timerUpdated:
        $ref: '#/components/messages/timerUpdated'
      # Media Sync
      youtubePlaySynced:
        $ref: '#/components/messages/youtubePlaySynced'
      youtubeStopSynced:
        $ref: '#/components/messages/youtubeStopSynced'
      # Combat Events
      playersPos:
        $ref: '#/components/messages/playersPos'
      playerStateUpdated:
        $ref: '#/components/messages/playerStateUpdated'
      playerAttacked:
        $ref: '#/components/messages/playerAttacked'
      partyHealed:
        $ref: '#/components/messages/partyHealed'
      reviveProgress:
        $ref: '#/components/messages/reviveProgress'
      reviveComplete:
        $ref: '#/components/messages/reviveComplete'
      reviveCancelled:
        $ref: '#/components/messages/reviveCancelled'
      bossRingAttack:
        $ref: '#/components/messages/bossRingAttack'
      playerProjectileFired:
        $ref: '#/components/messages/playerProjectileFired'
      # Reconnection Events
      playerReconnected:
        $ref: '#/components/messages/playerReconnected'
      lobbySync:
        $ref: '#/components/messages/lobbySync'
      reconnectResponse:
        $ref: '#/components/messages/reconnectResponse'
      connectionLost:
        $ref: '#/components/messages/connectionLost'
      reconnectAttempt:
        $ref: '#/components/messages/reconnectAttempt'
      # Session Events
      sessionPlayerJoined:
        $ref: '#/components/messages/sessionPlayerJoined'
      sessionPlayerLeft:
        $ref: '#/components/messages/sessionPlayerLeft'
      sessionHostChanged:
        $ref: '#/components/messages/sessionHostChanged'
      sessionPhaseChanged:
        $ref: '#/components/messages/sessionPhaseChanged'
      sessionTeamChanged:
        $ref: '#/components/messages/sessionTeamChanged'
      sessionAvatarSelected:
        $ref: '#/components/messages/sessionAvatarSelected'
      # Estimation Events
      estimationVoteCast:
        $ref: '#/components/messages/estimationVoteCast'
      estimationVotesRevealed:
        $ref: '#/components/messages/estimationVotesRevealed'
      estimationConsensusReached:
        $ref: '#/components/messages/estimationConsensusReached'
      estimationTimerStarted:
        $ref: '#/components/messages/estimationTimerStarted'
      estimationTimerPaused:
        $ref: '#/components/messages/estimationTimerPaused'
      estimationTimerResumed:
        $ref: '#/components/messages/estimationTimerResumed'
      estimationTimerExpired:
        $ref: '#/components/messages/estimationTimerExpired'
      estimationEstimateForced:
        $ref: '#/components/messages/estimationEstimateForced'
      estimationDiscussionTimerStarted:
        $ref: '#/components/messages/estimationDiscussionTimerStarted'
      estimationDiscussionEnded:
        $ref: '#/components/messages/estimationDiscussionEnded'
      # Combat Fine-grained Events
      combatBossDamaged:
        $ref: '#/components/messages/combatBossDamaged'
      combatBossHealed:
        $ref: '#/components/messages/combatBossHealed'
      combatBossEnraged:
        $ref: '#/components/messages/combatBossEnraged'
      combatBossTelegraph:
        $ref: '#/components/messages/combatBossTelegraph'
      combatBossDefeated:
        $ref: '#/components/messages/combatBossDefeated'
      combatPlayerDamaged:
        $ref: '#/components/messages/combatPlayerDamaged'
      combatPlayerDowned:
        $ref: '#/components/messages/combatPlayerDowned'
      combatPlayerRevived:
        $ref: '#/components/messages/combatPlayerRevived'
      combatRevivalStarted:
        $ref: '#/components/messages/combatRevivalStarted'
      combatRevivalCancelled:
        $ref: '#/components/messages/combatRevivalCancelled'
      combatPlayerEnteredBattle:
        $ref: '#/components/messages/combatPlayerEnteredBattle'
      combatModifierUpdated:
        $ref: '#/components/messages/combatModifierUpdated'
      combatCountdownStarted:
        $ref: '#/components/messages/combatCountdownStarted'
      combatCountdownTick:
        $ref: '#/components/messages/combatCountdownTick'
      combatCountdownComplete:
        $ref: '#/components/messages/combatCountdownComplete'
      combatTeamAttack:
        $ref: '#/components/messages/combatTeamAttack'
      combatMinionSpawned:
        $ref: '#/components/messages/combatMinionSpawned'
      combatMinionAttack:
        $ref: '#/components/messages/combatMinionAttack'
      combatMinionHealBoss:
        $ref: '#/components/messages/combatMinionHealBoss'
      combatMinionDamaged:
        $ref: '#/components/messages/combatMinionDamaged'
      combatMinionKilled:
        $ref: '#/components/messages/combatMinionKilled'
      # System Events
      systemFullState:
        $ref: '#/components/messages/systemFullState'
      systemMissedEvents:
        $ref: '#/components/messages/systemMissedEvents'

operations:
  # Client sends operations
  sendCreateLobby:
    action: send
    channel:
      $ref: '#/channels/clientToServer'
    messages:
      - $ref: '#/channels/clientToServer/messages/createLobby'
    summary: Client creates a new game lobby

  sendJoinLobby:
    action: send
    channel:
      $ref: '#/channels/clientToServer'
    messages:
      - $ref: '#/channels/clientToServer/messages/joinLobby'
    summary: Client joins an existing lobby

  sendSelectAvatar:
    action: send
    channel:
      $ref: '#/channels/clientToServer'
    messages:
      - $ref: '#/channels/clientToServer/messages/selectAvatar'
    summary: Client selects their character avatar

  sendSubmitScore:
    action: send
    channel:
      $ref: '#/channels/clientToServer'
    messages:
      - $ref: '#/channels/clientToServer/messages/submitScore'
    summary: Client submits their estimation score

  sendAttackBoss:
    action: send
    channel:
      $ref: '#/channels/clientToServer'
    messages:
      - $ref: '#/channels/clientToServer/messages/attackBoss'
    summary: Client attacks the boss

  sendReconnectWithToken:
    action: send
    channel:
      $ref: '#/channels/clientToServer'
    messages:
      - $ref: '#/channels/clientToServer/messages/reconnectWithToken'
    summary: Client attempts to reconnect using a token

  # Server receives operations
  receiveLobbyCreated:
    action: receive
    channel:
      $ref: '#/channels/serverToClient'
    messages:
      - $ref: '#/channels/serverToClient/messages/lobbyCreated'
    summary: Server notifies client of lobby creation

  receiveLobbyUpdated:
    action: receive
    channel:
      $ref: '#/channels/serverToClient'
    messages:
      - $ref: '#/channels/serverToClient/messages/lobbyUpdated'
    summary: Server broadcasts lobby state update

  receiveGameError:
    action: receive
    channel:
      $ref: '#/channels/serverToClient'
    messages:
      - $ref: '#/channels/serverToClient/messages/gameError'
    summary: Server sends error message to client

components:
  messages:
    # =============================================
    # CLIENT-TO-SERVER MESSAGES
    # =============================================

    # Lobby Management
    createLobby:
      name: create_lobby
      title: Create Lobby
      summary: Creates a new game lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CreateLobbyPayload'

    joinLobby:
      name: join_lobby
      title: Join Lobby
      summary: Joins an existing game lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/JoinLobbyPayload'

    # Avatar and Team
    selectAvatar:
      name: select_avatar
      title: Select Avatar
      summary: Selects character avatar class
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SelectAvatarPayload'

    assignTeam:
      name: assign_team
      title: Assign Team
      summary: Host assigns player to a team
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AssignTeamPayload'

    changeOwnTeam:
      name: change_own_team
      title: Change Own Team
      summary: Player changes their own team
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChangeOwnTeamPayload'

    # Ticket Management
    addTickets:
      name: add_tickets
      title: Add Tickets
      summary: Adds Jira tickets to the lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AddTicketsPayload'

    removeTicket:
      name: remove_ticket
      title: Remove Ticket
      summary: Removes a ticket from the lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RemoveTicketPayload'

    updateJiraSettings:
      name: update_jira_settings
      title: Update Jira Settings
      summary: Updates Jira integration settings
      contentType: application/json
      payload:
        $ref: '#/components/schemas/UpdateJiraSettingsPayload'

    # Lobby Movement
    lobbyPlayerPos:
      name: lobby_player_pos
      title: Lobby Player Position
      summary: Updates player position in lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyPlayerPosPayload'

    lobbyPlayerJump:
      name: lobby_player_jump
      title: Lobby Player Jump
      summary: Player jump state in lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyPlayerJumpPayload'

    lobbyEmote:
      name: lobby_emote
      title: Lobby Emote
      summary: Player sends emote in lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyEmotePayload'

    # Battle Control
    startBattle:
      name: start_battle
      title: Start Battle
      summary: Host starts the battle phase
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EmptyPayload'

    submitScore:
      name: submit_score
      title: Submit Score
      summary: Player submits estimation score
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubmitScorePayload'

    updateDiscussionVote:
      name: update_discussion_vote
      title: Update Discussion Vote
      summary: Player updates vote during discussion
      contentType: application/json
      payload:
        $ref: '#/components/schemas/UpdateDiscussionVotePayload'

    attackBoss:
      name: attack_boss
      title: Attack Boss
      summary: Player attacks the boss
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AttackBossPayload'

    proceedNextLevel:
      name: proceed_next_level
      title: Proceed Next Level
      summary: Advances to next boss level
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EmptyPayload'

    restartGame:
      name: restart_game
      title: Restart Game
      summary: Restarts the game
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EmptyPayload'

    # Performance and Control
    playerPerformance:
      name: player_performance
      title: Player Performance
      summary: Reports player performance metrics
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlayerPerformancePayload'

    abandonQuest:
      name: abandon_quest
      title: Abandon Quest
      summary: Abandons the current quest
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EmptyPayload'

    forceReveal:
      name: force_reveal
      title: Force Reveal
      summary: Forces vote reveal
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EmptyPayload'

    updateTimerSettings:
      name: update_timer_settings
      title: Update Timer Settings
      summary: Updates voting timer settings
      contentType: application/json
      payload:
        $ref: '#/components/schemas/UpdateTimerSettingsPayload'

    # Media
    youtubePlay:
      name: youtube_play
      title: YouTube Play
      summary: Starts YouTube video playback
      contentType: application/json
      payload:
        $ref: '#/components/schemas/YoutubePlayPayload'

    youtubeStop:
      name: youtube_stop
      title: YouTube Stop
      summary: Stops YouTube video playback
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EmptyPayload'

    # Admin Control
    advancePhaseNow:
      name: advancePhaseNow
      title: Advance Phase Now
      summary: Admin forces phase advancement
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AdvancePhaseNowPayload'

    forceVotingProgression:
      name: forceVotingProgression
      title: Force Voting Progression
      summary: Forces voting to progress
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ForceVotingProgressionPayload'

    # Combat Movement
    playerPos:
      name: player_pos
      title: Player Position
      summary: Updates player position in battle
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlayerPosPayload'

    attackPlayer:
      name: attack_player
      title: Attack Player
      summary: Player attacks another player
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AttackPlayerPayload'

    reviveStart:
      name: revive_start
      title: Revive Start
      summary: Starts reviving a downed player
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReviveTargetPayload'

    reviveCancel:
      name: revive_cancel
      title: Revive Cancel
      summary: Cancels reviving a player
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReviveTargetPayload'

    reviveTick:
      name: revive_tick
      title: Revive Tick
      summary: Tick event for revive progress
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReviveTargetPayload'

    healParty:
      name: heal_party
      title: Heal Party
      summary: Heals all party members
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EmptyPayload'

    playerJump:
      name: player_jump
      title: Player Jump
      summary: Player jump state in battle
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlayerJumpPayload'

    bossDamagePlayer:
      name: boss_damage_player
      title: Boss Damage Player
      summary: Boss damages a player
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BossDamagePlayerPayload'

    playerProjectile:
      name: player_projectile
      title: Player Projectile
      summary: Player fires a projectile
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlayerProjectilePayload'

    # Reconnection
    reconnectWithToken:
      name: reconnect_with_token
      title: Reconnect With Token
      summary: Reconnects using session token
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ReconnectWithTokenPayload'

    requestMissedEvents:
      name: request_missed_events
      title: Request Missed Events
      summary: Requests events missed during disconnect
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RequestMissedEventsPayload'

    # Minion and Discussion
    attackMinion:
      name: attack_minion
      title: Attack Minion
      summary: Attacks a minion player
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AttackMinionPayload'

    finalizeEstimate:
      name: finalize_estimate
      title: Finalize Estimate
      summary: Finalizes the estimation value
      contentType: application/json
      payload:
        $ref: '#/components/schemas/FinalizeEstimatePayload'

    # =============================================
    # SERVER-TO-CLIENT MESSAGES
    # =============================================

    # Lobby Events
    lobbyCreated:
      name: lobby_created
      title: Lobby Created
      summary: Confirms lobby was created
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyCreatedPayload'

    lobbyJoined:
      name: lobby_joined
      title: Lobby Joined
      summary: Confirms player joined lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyJoinedPayload'

    # The legacy full-state lobby refresh channel was retired in
    # Phase 42-02b (2026-05-07). State mutations now flow through
    # fine-grained session:*, combat:*, and estimation:* channels
    # documented below. The LobbyUpdatedPayload schema is retained
    # because boss_defeated / quest_abandoned / game_over still
    # reference it.

    avatarSelected:
      name: avatar_selected
      title: Avatar Selected
      summary: Broadcasts avatar selection
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AvatarSelectedPayload'

    lobbyPlayerPosServer:
      name: lobby_player_pos
      title: Lobby Player Position (Server)
      summary: Broadcasts player position in lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyPlayerPosServerPayload'

    lobbyPlayerJumpServer:
      name: lobby_player_jump
      title: Lobby Player Jump (Server)
      summary: Broadcasts player jump in lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyPlayerJumpServerPayload'

    lobbyEmoteServer:
      name: lobby_emote
      title: Lobby Emote (Server)
      summary: Broadcasts emote in lobby
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyEmoteServerPayload'

    playerJoined:
      name: player_joined
      title: Player Joined
      summary: Broadcasts new player joining
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlayerJoinedPayload'

    # Battle Events
    battleStarted:
      name: battle_started
      title: Battle Started
      summary: Battle phase has begun
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BattleStartedPayload'

    scoreSubmitted:
      name: score_submitted
      title: Score Submitted
      summary: Notifies that a player submitted score
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ScoreSubmittedPayload'

    scoresRevealed:
      name: scores_revealed
      title: Scores Revealed
      summary: Reveals all submitted scores
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ScoresRevealedPayload'

    bossAttacked:
      name: boss_attacked
      title: Boss Attacked
      summary: Boss was attacked
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BossAttackedPayload'

    bossDefeated:
      name: boss_defeated
      title: Boss Defeated
      summary: Boss has been defeated
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyUpdatedPayload'

    questAbandoned:
      name: quest_abandoned
      title: Quest Abandoned
      summary: Quest was abandoned
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyUpdatedPayload'

    gameOver:
      name: game_over
      title: Game Over
      summary: Game has ended
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LobbyUpdatedPayload'

    bossHealed:
      name: boss_healed
      title: Boss Healed
      summary: Boss has healed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BossHealedPayload'

    modifierUpdated:
      name: modifier_updated
      title: Modifier Updated
      summary: Battle modifier changed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ModifierUpdatedPayload'

    # Error and State Events
    gameError:
      name: game_error
      title: Game Error
      summary: Error message from server
      contentType: application/json
      payload:
        $ref: '#/components/schemas/GameErrorPayload'

    votingTimeout:
      name: voting_timeout
      title: Voting Timeout
      summary: Voting timer has expired
      contentType: application/json
      payload:
        $ref: '#/components/schemas/VotingTimeoutPayload'

    playerDisconnected:
      name: player_disconnected
      title: Player Disconnected
      summary: Player has disconnected
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlayerDisconnectedPayload'

    hostTransferred:
      name: host_transferred
      title: Host Transferred
      summary: Host status transferred to another player
      contentType: application/json
      payload:
        $ref: '#/components/schemas/HostTransferredPayload'

    timerUpdated:
      name: timer_updated
      title: Timer Updated
      summary: Timer state has changed
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TimerUpdatedPayload'

