  schemas:
    # =============================================
    # CORE TYPE SCHEMAS
    # =============================================

    Position:
      type: object
      description: 2D position coordinates
      required:
        - x
        - y
      properties:
        x:
          type: number
          description: X coordinate
        y:
          type: number
          description: Y coordinate

    TeamType:
      type: string
      description: Player team assignment
      enum:
        - developers
        - qa
        - spectators

    AvatarClass:
      type: string
      description: Character avatar class
      enum:
        - ranger
        - rogue
        - bard
        - sorcerer
        - wizard
        - warrior
        - paladin
        - cleric
        - oathbreaker
        - monk

    GamePhase:
      type: string
      description: Current game phase
      enum:
        - lobby
        - avatar_selection
        - battle
        - scoring
        - reveal
        - discussion
        - victory
        - next_level
        - game_over

    EstimationScaleType:
      type: string
      description: Estimation scale type
      enum:
        - fibonacci
        - doubling
        - tshirt

    ScoreValue:
      oneOf:
        - type: number
        - type: string
          const: '?'
      description: Estimation score (number or question mark for abstain)

    ReconnectResult:
      type: string
      description: Reconnection attempt result
      enum:
        - success
        - lobby_closed
        - host_changed
        - invalid_token
        - grace_expired
        - server_error

    DamageSource:
      type: string
      description: Source of damage
      enum:
        - boss
        - player

    # =============================================
    # COMPLEX TYPE SCHEMAS
    # =============================================

    TimerSettings:
      type: object
      description: Timer configuration
      required:
        - enabled
        - durationMinutes
      properties:
        enabled:
          type: boolean
        durationMinutes:
          type: number
          minimum: 1

    JiraSettings:
      type: object
      description: Jira integration settings
      properties:
        baseUrl:
          type: string
          description: Jira base URL (e.g. https://company.atlassian.net/browse/)

    ConsensusSettings:
      type: object
      description: Consensus countdown settings
      required:
        - countdownSeconds
      properties:
        countdownSeconds:
          type: number
          minimum: 1
          default: 5

    EstimationSettings:
      type: object
      description: Estimation scale settings
      required:
        - scaleType
      properties:
        scaleType:
          $ref: '#/components/schemas/EstimationScaleType'
        customTshirtMapping:
          type: object
          additionalProperties:
            type: number
          description: Custom point values for T-shirt sizes

    TimerState:
      type: object
      description: Active timer state
      required:
        - startedAt
        - durationMs
        - isActive
      properties:
        startedAt:
          type: number
          description: Timestamp when timer started
        durationMs:
          type: number
          description: Timer duration in milliseconds
        isActive:
          type: boolean

    JiraTicket:
      type: object
      description: Jira ticket for estimation
      required:
        - id
        - title
        - description
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        storyPoints:
          type: number

    CompletedTicket:
      type: object
      description: Completed estimation ticket
      required:
        - id
        - title
        - description
        - storyPoints
        - completedAt
        - teamBreakdown
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        storyPoints:
          type: number
        completedAt:
          type: string
          format: date-time
        teamBreakdown:
          type: object
          properties:
            developers:
              type: object
              properties:
                participated:
                  type: boolean
                consensusScore:
                  type: number
            qa:
              type: object
              properties:
                participated:
                  type: boolean
                consensusScore:
                  type: number

    Boss:
      type: object
      description: Boss entity
      required:
        - id
        - name
        - maxHealth
        - currentHealth
        - phase
        - maxPhases
        - sprite
        - defeated
      properties:
        id:
          type: string
        name:
          type: string
        maxHealth:
          type: number
        currentHealth:
          type: number
        phase:
          type: number
        maxPhases:
          type: number
        sprite:
          type: string
        defeated:
          type: boolean
        lastRingAttack:
          type: number

    PlayerCombatState:
      type: object
      description: Player combat state
      required:
        - maxHp
        - hp
        - isDowned
      properties:
        maxHp:
          type: number
        hp:
          type: number
        isDowned:
          type: boolean
        lastDamagedBy:
          type: string
        revivedBy:
          type: string
        reviveEndsAt:
          type: number
        position:
          $ref: '#/components/schemas/Position'
        isJumping:
          type: boolean

    Player:
      type: object
      description: Player in a lobby
      required:
        - id
        - name
        - avatar
        - avatarClass
        - team
        - isHost
        - hasSubmittedScore
      properties:
        id:
          type: string
        name:
          type: string
        avatar:
          $ref: '#/components/schemas/AvatarClass'
        avatarClass:
          $ref: '#/components/schemas/AvatarClass'
        team:
          $ref: '#/components/schemas/TeamType'
        isHost:
          type: boolean
        currentScore:
          $ref: '#/components/schemas/ScoreValue'
        hasSubmittedScore:
          type: boolean

    TeamStats:
      type: object
      description: Team statistics
      required:
        - totalStoryPoints
        - ticketsCompleted
        - averageEstimationTime
        - consensusRate
        - accuracyScore
        - participationRate
        - achievements
        - currentStreak
        - bestStreak
      properties:
        totalStoryPoints:
          type: number
        ticketsCompleted:
          type: number
        averageEstimationTime:
          type: number
        consensusRate:
          type: number
        accuracyScore:
          type: number
        participationRate:
          type: number
        achievements:
          type: array
          items:
            type: string
        currentStreak:
          type: number
        bestStreak:
          type: number

    TeamCompetition:
      type: object
      description: Team competition state
      required:
        - developers
        - qa
        - currentRound
        - winnerHistory
        - seasonStart
      properties:
        developers:
          $ref: '#/components/schemas/TeamStats'
        qa:
          $ref: '#/components/schemas/TeamStats'
        currentRound:
          type: number
        winnerHistory:
          type: array
          items:
            $ref: '#/components/schemas/TeamType'
        seasonStart:
          type: string

    ConsensusCountdown:
      type: object
      description: Consensus countdown state
      required:
        - isActive
        - remainingSeconds
        - startedAt
      properties:
        isActive:
          type: boolean
        remainingSeconds:
          type: number
        startedAt:
          type: number

    Lobby:
      type: object
      description: Game lobby state
      required:
        - id
        - name
        - hostId
        - players
        - teams
        - tickets
        - gamePhase
        - completedTickets
        - teamCompetition
        - playerCombatStates
        - playerPositions
      properties:
        id:
          type: string
        name:
          type: string
        hostId:
          type: string
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        teams:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Player'
        currentTicket:
          $ref: '#/components/schemas/JiraTicket'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/JiraTicket'
        gamePhase:
          $ref: '#/components/schemas/GamePhase'
        boss:
          $ref: '#/components/schemas/Boss'
        completedTickets:
          type: array
          items:
            $ref: '#/components/schemas/CompletedTicket'
        teamCompetition:
          $ref: '#/components/schemas/TeamCompetition'
        playerCombatStates:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlayerCombatState'
        playerPositions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Position'
        timerSettings:
          $ref: '#/components/schemas/TimerSettings'
        jiraSettings:
          $ref: '#/components/schemas/JiraSettings'
        consensusSettings:
          $ref: '#/components/schemas/ConsensusSettings'
        estimationSettings:
          $ref: '#/components/schemas/EstimationSettings'
        currentTimer:
          $ref: '#/components/schemas/TimerState'
        consensusCountdown:
          $ref: '#/components/schemas/ConsensusCountdown'
        votingStartedAt:
          type: number
        battleModifier:
          type: number
        battleStartTime:
          type: number

    TeamScores:
      type: object
      description: Team score mapping
      properties:
        developers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ScoreValue'
        qa:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ScoreValue'

    TeamConsensus:
      type: object
      description: Team consensus state
      properties:
        developers:
          type: object
          properties:
            hasConsensus:
              type: boolean
            score:
              type: number
        qa:
          type: object
          properties:
            hasConsensus:
              type: boolean
            score:
              type: number

    LobbySync:
      type: object
      description: Full lobby synchronization data
      required:
        - lobby
        - yourPlayer
        - reconnectToken
      properties:
        lobby:
          $ref: '#/components/schemas/Lobby'
        yourPlayer:
          $ref: '#/components/schemas/Player'
        reconnectToken:
          type: string
        pendingActions:
          type: object
          properties:
            timers:
              $ref: '#/components/schemas/TimerState'
            consensus: {}
            battleState: {}
        stateChanges:
          type: object
          properties:
            playersJoined:
              type: array
              items:
                type: string
            playersLeft:
              type: array
              items:
                type: string
            phaseChanged:
              type: boolean
            ticketsChanged:
              type: boolean

    ReconnectResponse:
      type: object
      description: Response to reconnection attempt
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/ReconnectResult'
        lobbySync:
          $ref: '#/components/schemas/LobbySync'
        message:
          type: string
        newHost:
          type: string

    Projectile:
      type: object
      description: Projectile in boss ring attack
      required:
        - id
        - x
        - y
        - targetX
        - targetY
        - emoji
      properties:
        id:
          type: string
        x:
          type: number
        y:
          type: number
        targetX:
          type: number
        targetY:
          type: number
        emoji:
          type: string

    HealedPlayer:
      type: object
      description: Player that was healed
      required:
        - playerId
        - newHealth
      properties:
        playerId:
          type: string
        newHealth:
          type: number

    MissedEvent:
      type: object
      description: An event that was missed during disconnect
      required:
        - event
        - data
      properties:
        event:
          type: string
        data: {}

    # =============================================
    # PAYLOAD SCHEMAS - CLIENT TO SERVER
    # =============================================

    EmptyPayload:
      type: object
      description: Empty payload for events with no data

    CreateLobbyPayload:
      type: object
      required:
        - lobbyName
        - hostName
      properties:
        lobbyName:
          type: string
          minLength: 1
          maxLength: 100
        hostName:
          type: string
          minLength: 1
          maxLength: 50
        initialSettings:
          type: object
          properties:
            timerSettings:
              $ref: '#/components/schemas/TimerSettings'
            jiraSettings:
              $ref: '#/components/schemas/JiraSettings'
            estimationSettings:
              $ref: '#/components/schemas/EstimationSettings'
            customLobbyId:
              type: string
              pattern: '^[a-zA-Z0-9-]{3,30}$'

    JoinLobbyPayload:
      type: object
      required:
        - lobbyId
        - playerName
      properties:
        lobbyId:
          type: string
          minLength: 1
        playerName:
          type: string
          minLength: 1
          maxLength: 50

    SelectAvatarPayload:
      type: object
      required:
        - avatarClass
      properties:
        avatarClass:
          $ref: '#/components/schemas/AvatarClass'

    AssignTeamPayload:
      type: object
      required:
        - playerId
        - team
      properties:
        playerId:
          type: string
        team:
          $ref: '#/components/schemas/TeamType'

    ChangeOwnTeamPayload:
      type: object
      required:
        - team
      properties:
        team:
          $ref: '#/components/schemas/TeamType'

    AddTicketsPayload:
